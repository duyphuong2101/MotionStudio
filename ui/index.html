<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motion Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/ui/app.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo"><i aria-hidden="true"></i>Motion Studio</div>
    <label class="sr" for="proj">Project</label>
    <select class="proj" id="proj"></select>
    <button class="btn sm" id="new-proj">+ New project</button>
    <span class="spacer"></span>
    <span class="status" id="topstatus" aria-live="polite"></span>
    <button class="btn sm" id="assistant-toggle" aria-pressed="false" aria-controls="assistant">Assistant</button>
  </header>
  <nav id="nav" aria-label="Navigation">
    <button class="on" data-tab="jobs">Jobs</button>
    <button data-tab="tpl">Templates</button>
    <button data-tab="brand">Brand</button>
    <button data-tab="settings">Settings</button>
    <button data-tab="help">Guide</button>
  </nav>
  <div class="conn" id="conn" role="alert" hidden></div>
  <main id="main">
    <section class="tab on" id="tab-jobs">
      <div class="jobs">
        <div class="side">
          <div class="seg" id="listmode" role="group" aria-label="List">
            <button type="button" data-mode="jobs" class="on" aria-pressed="true">Jobs <span id="n-jobs"></span></button>
            <button type="button" data-mode="seqs" aria-pressed="false">Sequences <span id="n-seqs"></span></button>
          </div>
          <div id="side-jobs">
            <div class="listhead"><button class="btn p sm" id="new-brief">+ New brief</button><button class="btn sm" id="new-script">+ New from script</button></div>
            <div class="dir" id="director"></div>
            <div class="chips" id="jobfilter" role="group" aria-label="Show jobs"></div>
            <div class="list" id="joblist"></div>
          </div>
          <div id="side-seqs" hidden>
            <div class="listhead"><button class="btn p sm" id="new-seq">+ New sequence</button></div>
            <p class="muted small">A sequence joins finished videos of one format into one MP4.</p>
            <div class="list" id="seqlist"></div>
          </div>
        </div>
        <div class="detail" id="detail"><p class="muted">Select a job on the left.</p></div>
      </div>
    </section>
    <section class="tab" id="tab-tpl"></section>
    <section class="tab" id="tab-brand"></section>
    <section class="tab" id="tab-settings"></section>
    <section class="tab" id="tab-help"></section>
  </main>
  <aside class="assistant" id="assistant" aria-label="Assistant" hidden>
    <div class="as-head">
      <h2>Assistant</h2>
      <span class="muted small as-scope" id="as-scope"></span>
      <button class="btn sm" id="as-clear" hidden>Clear</button>
      <button class="as-icon" id="as-close" aria-label="Hide assistant" title="Hide assistant"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
    </div>
    <div class="as-transcript" id="as-transcript"></div>
    <form class="as-composer" id="as-form">
      <div class="as-box">
        <label class="sr" for="as-input">Ask the assistant</label>
        <textarea id="as-input" rows="1" maxlength="800" autocomplete="off" placeholder="Ask anything about this project…"></textarea>
        <div class="as-bar">
          <label class="sr" for="as-model">Model</label>
          <select id="as-model" class="as-model"><option value="">Commands only</option></select>
          <span class="as-spacer"></span>
          <button type="button" class="as-icon" id="as-help" aria-label="What can I ask?" title="What can I ask?"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M6.2 6.4a1.9 1.9 0 1 1 2.7 1.7c-.6.3-.9.7-.9 1.3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="8" cy="11.4" r=".8" fill="currentColor"/></svg></button>
          <button type="button" class="as-icon" id="as-mic" aria-label="Speak" aria-pressed="false" title="Speak" hidden><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><rect x="5.5" y="1.5" width="5" height="8" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M3.5 7.5a4.5 4.5 0 0 0 9 0M8 12v2.5M5.5 14.5h5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
          <button class="as-send" id="as-send" type="submit" aria-label="Send" title="Send" disabled><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M2 8l12-5.5L10.5 14 8.3 9.2 2 8z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M8.3 9.2L14 2.5" stroke="currentColor" stroke-width="1.4"/></svg></button>
        </div>
      </div>
    </form>
  </aside>
</div>
<dialog class="dlg" id="dlg"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="/ui/app.js"></script>
</body>
</html>
